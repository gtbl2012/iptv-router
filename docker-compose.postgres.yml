services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${POSTGRES_DATABASE_URL:?Set POSTGRES_DATABASE_URL in .env}

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${POSTGRES_DATABASE_URL:?Set POSTGRES_DATABASE_URL in .env}

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iptv_router}
      POSTGRES_USER: ${POSTGRES_USER:-iptv_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Set POSTGRES_DATA_HOST_PATH when PostgreSQL should also use a host
      # directory instead of the Docker-managed postgres-data volume.
      - ${POSTGRES_DATA_HOST_PATH:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
