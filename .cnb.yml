# CNB Cloud Native Build configuration.
#
# The root Dockerfile contains the API, React Router SSR console, ffmpeg, and
# same-origin gateway. CNB injects CNB_DOCKER_REGISTRY and the repository token
# for pushes to the repository's Docker artifact registry; no credentials are
# stored in this file.

main:
  push:
    - name: build and publish docker image
      services:
        - docker
      env:
        IMAGE_REPOSITORY: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: build docker image
          script: |
            set -eu
            image="${IMAGE_REPOSITORY}:${CNB_COMMIT_SHORT}"
            latest="${IMAGE_REPOSITORY}:latest"
            # Older NAS clients can reject the OCI index that BuildKit creates
            # for provenance attestations. Publish a Docker v2 amd64 manifest
            # without attestations for broad Container Manager compatibility.
            export BUILDX_NO_DEFAULT_ATTESTATIONS=1
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --output=type=registry,oci-mediatypes=false \
              --build-arg VITE_API_URL=/api \
              --build-arg VITE_PUBLIC_API_ORIGIN= \
              --build-arg VITE_INLINE_BODY_MAX_BYTES=16777216 \
              --build-arg VITE_DEMO_MODE=false \
              -t "$image" \
              -t "$latest" \
              .

v*:
  tag_push:
    - name: publish versioned docker image
      services:
        - docker
      env:
        IMAGE_REPOSITORY: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: build and publish tag
          script: |
            set -eu
            image="${IMAGE_REPOSITORY}:${CNB_BRANCH}"
            latest="${IMAGE_REPOSITORY}:latest"
            export BUILDX_NO_DEFAULT_ATTESTATIONS=1
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --output=type=registry,oci-mediatypes=false \
              --build-arg VITE_API_URL=/api \
              --build-arg VITE_PUBLIC_API_ORIGIN= \
              --build-arg VITE_INLINE_BODY_MAX_BYTES=16777216 \
              --build-arg VITE_DEMO_MODE=false \
              -t "$image" \
              -t "$latest" \
              .
